backend:
  name: git-gateway
  repo: joaomartingabriel-wq/martinbase
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/1f70629a-e3b8-4261-a226-54a7a029d2e9/pkce
  auth_token_endpoint: /sites/1f70629a-e3b8-4261-a226-54a7a029d2e9/token
  gateway_url: https://gateway.decapbridge.com

# Ver quem editou o quê (opcional)
commit_messages:
  create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
  update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
  delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
  uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
  deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
  openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Campos do login PKCE (opcional, recomendado)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Link do site e logo no painel (opcional)
site_url: https://martinbase.com
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Mídia
media_folder: "images/uploads"
public_folder: "/images/uploads"

# Interface em português
locale: pt

# Publicação manual
publish_mode: editorial_workflow

collections:

  # ══════════════════════════════════════════════════════════
  #  CONTEÚDO DO SITE — arquivo único data/site.json
  # ══════════════════════════════════════════════════════════
  - name: "site"
    label: "Conteúdo do Site"
    files:

      # Todo o conteúdo vive em um único arquivo (data/site.json),
      # por isso há uma única entrada aqui. As seções aparecem como
      # blocos recolhíveis dentro do formulário.
      - name: "conteudo"
        label: "Página inicial — todas as seções"
        file: "data/site.json"
        description: "Abra o bloco da seção que quiser editar. Cada alteração vira uma revisão antes de ir ao ar."
        fields:
          - label: "Dados da Empresa e Contato"
            name: "empresa"
            widget: "object"
            fields:
              - { label: "Nome da agência", name: "nome", widget: "string" }
              - { label: "Slogan", name: "slogan", widget: "string" }
              - { label: "WhatsApp (só números, com país e DDD — ex: 5551997749263)", name: "whatsapp", widget: "string", pattern: ['^[0-9]{12,13}$', 'Digite apenas números, ex: 5551997749263'] }
              - { label: "Mensagem que abre no WhatsApp", name: "whatsapp_msg", widget: "string" }
              - { label: "Telefone como aparece no site", name: "telefone_exibicao", widget: "string" }
              - { label: "E-mail", name: "email", widget: "string" }
              - { label: "Site (sem https)", name: "site", widget: "string" }
              - { label: "Cidade", name: "cidade", widget: "string" }
              - { label: "Estado", name: "estado", widget: "string" }
              - { label: "Abrangência de atendimento", name: "abrangencia", widget: "string" }

          - label: "SEO — como o site aparece no Google e no WhatsApp"
            name: "seo"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Título da página", name: "titulo", widget: "string" }
              - { label: "Descrição (até ~155 caracteres)", name: "descricao", widget: "text" }

          - label: "Rodapé"
            name: "rodape"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Texto de apresentação", name: "tagline", widget: "text" }
              - { label: "Linha de copyright", name: "copyright", widget: "string" }

          # campos abaixo existem no arquivo mas são editados nas outras abas
          - { label: "Topo", name: "hero", widget: "object", collapsed: true, fields: [
              { label: "Prefixo do selo", name: "kicker_prefixo", widget: "string" },
              { label: "Palavras que alternam", name: "kicker_palavras", widget: "list", field: { label: "Palavra", name: "palavra", widget: "string" } },
              { label: "Título — início", name: "titulo_inicio", widget: "string" },
              { label: "Título — parte destacada em verde", name: "titulo_destaque", widget: "string" },
              { label: "Título — final", name: "titulo_fim", widget: "string" },
              { label: "Parágrafo de apresentação", name: "subtitulo", widget: "text" },
              { label: "Botão principal", name: "cta_primario", widget: "string" },
              { label: "Botão secundário", name: "cta_secundario", widget: "string" },
              { label: "Painel — referência", name: "painel_ref", widget: "string" },
              { label: "Painel — status", name: "painel_status", widget: "string" },
              { label: "Painel — linhas", name: "painel_linhas", widget: "list", fields: [
                  { label: "Rótulo", name: "chave", widget: "string" },
                  { label: "Valor", name: "valor", widget: "string" } ] } ] }
          - { label: "Números", name: "metricas", widget: "list", collapsed: true, fields: [
              { label: "Número", name: "numero", widget: "string" },
              { label: "Sufixo", name: "sufixo", widget: "string", required: false },
              { label: "Descrição", name: "label", widget: "text" } ] }
          - { label: "Faixa verde", name: "marquee", widget: "list", collapsed: true, field: { label: "Termo", name: "termo", widget: "string" } }
          - { label: "Diferencial", name: "diferencial", widget: "object", collapsed: true, fields: [
              { label: "Rótulo", name: "rotulo", widget: "string" },
              { label: "Título", name: "titulo", widget: "string" },
              { label: "Nota", name: "nota", widget: "text" },
              { label: "Pilares", name: "pilares", widget: "list", fields: [
                  { label: "Número", name: "indice", widget: "string" },
                  { label: "Título", name: "titulo", widget: "string" },
                  { label: "Texto", name: "texto", widget: "text" } ] } ] }
          - { label: "Portfólio", name: "portfolio", widget: "object", collapsed: true, fields: [
              { label: "Rótulo", name: "rotulo", widget: "string" },
              { label: "Título", name: "titulo", widget: "string" },
              { label: "Nota", name: "nota", widget: "text" },
              { label: "Projetos", name: "cases", widget: "list", fields: [
                  { label: "Etiqueta", name: "tag", widget: "string" },
                  { label: "Nome do projeto", name: "titulo", widget: "string" },
                  { label: "Descrição", name: "texto", widget: "text" },
                  { label: "Link", name: "url", widget: "string" },
                  { label: "Domínio", name: "dominio", widget: "string" },
                  { label: "Imagem", name: "imagem", widget: "image" },
                  { label: "Cor da barra", name: "cor_barra", widget: "string", required: false },
                  { label: "Cor do endereço", name: "cor_url", widget: "string", required: false },
                  { label: "Cor de fundo", name: "cor_fundo", widget: "string", required: false } ] } ] }
          - { label: "Serviços", name: "servicos", widget: "object", collapsed: true, fields: [
              { label: "Rótulo", name: "rotulo", widget: "string" },
              { label: "Título", name: "titulo", widget: "string" },
              { label: "Nota", name: "nota", widget: "text" },
              { label: "Serviços", name: "itens", widget: "list", fields: [
                  { label: "Nome", name: "titulo", widget: "string" },
                  { label: "Destacar", name: "destaque", widget: "boolean", default: false },
                  { label: "Selo", name: "selo", widget: "string", required: false },
                  { label: "Descrição", name: "lead", widget: "text" },
                  { label: "Itens", name: "bullets", widget: "list", field: { label: "Item", name: "item", widget: "string" } },
                  { label: "Rodapé do card", name: "meta", widget: "string" } ] } ] }
          - label: "Cases — identidade e interface por nicho"
            name: "cases"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Rótulo", name: "rotulo", widget: "string" }
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Nota", name: "nota", widget: "text" }
              - label: "Cases"
                name: "itens"
                widget: "list"
                fields:
                  - { label: "Etiqueta (nicho · tipo)", name: "tag", widget: "string" }
                  - { label: "Título do case", name: "titulo", widget: "string" }
                  - { label: "Descrição", name: "descricao", widget: "text" }
                  - label: "Mockup — a tela desenhada"
                    name: "mockup"
                    widget: "object"
                    fields:
                      - { label: "Tema", name: "tema", widget: "select", options: ["claro", "escuro"] }
                      - { label: "Endereço na barra do navegador", name: "url", widget: "string" }
                      - { label: "Nome da marca", name: "marca", widget: "string" }
                      - { label: "Linha abaixo da marca", name: "marca_sub", widget: "string" }
                      - { label: "Itens do menu", name: "links", widget: "list", field: { label: "Item", name: "item", widget: "string" } }
                      - { label: "Botão do menu", name: "cta", widget: "string" }
                      - { label: "Etiqueta acima do título", name: "kicker", widget: "string" }
                      - { label: "Título (use {chaves} para destacar em cor)", name: "titulo", widget: "string" }
                      - { label: "Subtítulo", name: "subtitulo", widget: "text" }
                      - { label: "Botão principal", name: "botao1", widget: "string" }
                      - { label: "Botão secundário", name: "botao2", widget: "string" }
                      - { label: "Selos de confiança", name: "selos", widget: "list", field: { label: "Selo", name: "selo", widget: "string" } }
                      - { label: "Legenda sobre a imagem", name: "badge", widget: "string" }
                  - { label: "Decisões de design", name: "decisoes", widget: "list", field: { label: "Item", name: "item", widget: "string" } }
                  - { label: "Estrutura", name: "estrutura", widget: "list", field: { label: "Item", name: "item", widget: "string" } }
                  - { label: "Paleta (cores em hex)", name: "paleta", widget: "list", field: { label: "Cor", name: "cor", widget: "string" } }

          - { label: "Depoimentos", name: "depoimentos", widget: "object", collapsed: true, fields: [
              { label: "Rótulo", name: "rotulo", widget: "string" },
              { label: "Título", name: "titulo", widget: "string" },
              { label: "Nota", name: "nota", widget: "text" },
              { label: "Depoimentos", name: "itens", widget: "list", fields: [
                  { label: "Selo de aviso (deixe vazio quando o depoimento for real)", name: "selo", widget: "string", required: false },
                  { label: "Depoimento", name: "texto", widget: "text" },
                  { label: "Nome", name: "autor", widget: "string" },
                  { label: "Cargo e empresa", name: "cargo", widget: "string" } ] } ] }
          - { label: "Processo", name: "processo", widget: "object", collapsed: true, fields: [
              { label: "Rótulo", name: "rotulo", widget: "string" },
              { label: "Título", name: "titulo", widget: "string" },
              { label: "Nota", name: "nota", widget: "text" },
              { label: "Etapas", name: "etapas", widget: "list", fields: [
                  { label: "Número", name: "numero", widget: "string" },
                  { label: "Título", name: "titulo", widget: "string" },
                  { label: "Texto", name: "texto", widget: "text" } ] } ] }
          - { label: "Dúvidas", name: "faq", widget: "object", collapsed: true, fields: [
              { label: "Rótulo", name: "rotulo", widget: "string" },
              { label: "Título", name: "titulo", widget: "string" },
              { label: "Nota", name: "nota", widget: "text" },
              { label: "Perguntas", name: "itens", widget: "list", fields: [
                  { label: "Pergunta", name: "pergunta", widget: "string" },
                  { label: "Resposta", name: "resposta", widget: "text" } ] } ] }
          - { label: "Chamada final", name: "cta_final", widget: "object", collapsed: true, fields: [
              { label: "Título", name: "titulo", widget: "string" },
              { label: "Texto", name: "texto", widget: "text" },
              { label: "Botão", name: "botao", widget: "string" } ] }

  # ══════════════════════════════════════════════════════════
  #  PÁGINA PARA PSICÓLOGOS — arquivo data/psicologos.json
  # ══════════════════════════════════════════════════════════
  - name: "psicologos"
    label: "Página — Psicólogos"
    files:

      - name: "conteudo"
        label: "Landing page de psicólogos"
        file: "data/psicologos.json"
        description: "Conteúdo da página martinbase.com/psicologos. Cada bloco abaixo é uma seção da página."
        fields:
          - label: "SEO — como aparece no Google e no WhatsApp"
            name: "seo"
            widget: "object"
            fields:
              - { label: "Título da página", name: "titulo", widget: "string" }
              - { label: "Descrição (até ~155 caracteres)", name: "descricao", widget: "text" }

          - label: "Topo da página"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Etiqueta pequena", name: "kicker", widget: "string" }
              - { label: "Título — primeira parte", name: "titulo_inicio", widget: "string" }
              - { label: "Título — parte em verde", name: "titulo_destaque", widget: "string" }
              - { label: "Subtítulo", name: "subtitulo", widget: "text" }
              - { label: "Botão principal", name: "cta_primario", widget: "string" }
              - { label: "Botão secundário", name: "cta_secundario", widget: "string" }
              - { label: "Mensagem que abre no WhatsApp", name: "wa_msg", widget: "string" }
              - { label: "Selos (3 itens curtos)", name: "selos", widget: "list", field: { label: "Selo", name: "selo", widget: "string" } }

          - label: "O cenário — onde o paciente se perde"
            name: "problema"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Rótulo", name: "rotulo", widget: "string" }
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Nota", name: "nota", widget: "text" }
              - { label: "Pontos", name: "itens", widget: "list", fields: [
                  { label: "Número", name: "numero", widget: "string" },
                  { label: "Título", name: "titulo", widget: "string" },
                  { label: "Texto", name: "texto", widget: "text" } ] }

          - label: "Presença digital — por que isso importa"
            name: "valor"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Rótulo", name: "rotulo", widget: "string" }
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Declaração — primeira linha", name: "declaracao_1", widget: "string" }
              - { label: "Declaração — segunda linha (em verde)", name: "declaracao_2", widget: "string" }
              - { label: "Ideias", name: "itens", widget: "list", fields: [
                  { label: "Número", name: "numero", widget: "string" },
                  { label: "Título", name: "titulo", widget: "string" },
                  { label: "Texto", name: "texto", widget: "text" } ] }
              - { label: "Frase de fechamento (destacada em verde)", name: "fecho", widget: "text" }

          - label: "O que você recebe"
            name: "entrega"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Rótulo", name: "rotulo", widget: "string" }
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Nota", name: "nota", widget: "text" }
              - { label: "Itens", name: "itens", widget: "list", fields: [
                  { label: "Título", name: "titulo", widget: "string" },
                  { label: "Texto", name: "texto", widget: "text" } ] }

          - label: "Prova — case da área"
            name: "prova"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Rótulo", name: "rotulo", widget: "string" }
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Nome do cliente", name: "case_nome", widget: "string" }
              - { label: "Área", name: "case_area", widget: "string" }
              - { label: "Endereço do site (sem https)", name: "case_url", widget: "string" }
              - { label: "Descrição do projeto", name: "case_texto", widget: "text" }
              - { label: "Nota ao lado", name: "nota", widget: "text" }

          - label: "Como funciona"
            name: "processo"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Rótulo", name: "rotulo", widget: "string" }
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Nota", name: "nota", widget: "text" }
              - { label: "Etapas", name: "etapas", widget: "list", fields: [
                  { label: "Número", name: "numero", widget: "string" },
                  { label: "Título", name: "titulo", widget: "string" },
                  { label: "Texto", name: "texto", widget: "text" } ] }

          - label: "Investimento"
            name: "investimento"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Rótulo", name: "rotulo", widget: "string" }
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Faixa de preço (número grande)", name: "faixa", widget: "string" }
              - { label: "Explicação da faixa", name: "faixa_nota", widget: "text" }
              - { label: "Título da coluna do que inclui", name: "inclusos_titulo", widget: "string" }
              - { label: "O que está incluído", name: "inclusos", widget: "list", field: { label: "Item", name: "item", widget: "string" } }
              - { label: "Título da coluna do que não paga", name: "sem_titulo", widget: "string" }
              - { label: "O que não paga", name: "sem", widget: "list", field: { label: "Item", name: "item", widget: "string" } }
              - { label: "Nota final sobre domínio e hospedagem", name: "nota_final", widget: "text" }

          - label: "Dúvidas"
            name: "faq"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Rótulo", name: "rotulo", widget: "string" }
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Nota", name: "nota", widget: "text" }
              - { label: "Perguntas", name: "itens", widget: "list", fields: [
                  { label: "Pergunta", name: "pergunta", widget: "string" },
                  { label: "Resposta", name: "resposta", widget: "text" } ] }

          - label: "Formulário de contato"
            name: "form"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Rótulo", name: "rotulo", widget: "string" }
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Nota", name: "nota", widget: "text" }
              - { label: "Rótulo — nome", name: "campo_nome", widget: "string" }
              - { label: "Rótulo — e-mail", name: "campo_email", widget: "string" }
              - { label: "Rótulo — WhatsApp", name: "campo_whatsapp", widget: "string" }
              - { label: "Rótulo — cidade", name: "campo_cidade", widget: "string" }
              - { label: "Rótulo — situação", name: "campo_situacao", widget: "string" }
              - { label: "Opções de situação", name: "opcoes_situacao", widget: "list", field: { label: "Opção", name: "opcao", widget: "string" } }
              - { label: "Rótulo — mensagem", name: "campo_mensagem", widget: "string" }
              - { label: "Texto do botão", name: "botao", widget: "string" }
              - { label: "Frase alternativa ao formulário", name: "alternativa", widget: "string" }
              - { label: "Texto do link de WhatsApp", name: "alternativa_cta", widget: "string" }
              - { label: "Mensagem que abre no WhatsApp", name: "wa_msg", widget: "string" }

          - label: "Chamada final"
            name: "cta_final"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Texto", name: "texto", widget: "text" }
              - { label: "Botão", name: "botao", widget: "string" }
              - { label: "Mensagem que abre no WhatsApp", name: "wa_msg", widget: "string" }
