<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada — Martin Base</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0C08">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230B0C08'/%3E%3Crect x='5' y='19' width='5' height='8' fill='%2317B96A'/%3E%3Crect x='13' y='13' width='5' height='14' fill='%2317B96A'/%3E%3Crect x='21' y='6' width='5' height='21' fill='%2317B96A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#F4EFE4;--ink-soft:#9A9C8C;--paper:#0B0C08;--line:#2B2E22;--accent:#17B96A}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;line-height:1.5}
.wrap{max-width:46ch;text-align:left}
.mark{display:flex;align-items:flex-end;gap:3px;height:22px;margin-bottom:2.5rem}
.mark span{width:5px;background:var(--accent);display:block}
.mark span:nth-child(1){height:8px}
.mark span:nth-child(2){height:14px}
.mark span:nth-child(3){height:22px}
.cod{font-family:'IBM Plex Mono',monospace;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:.9rem}
h1{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:700;letter-spacing:-.02em;margin-bottom:1rem}
p{color:var(--ink-soft);font-size:1rem;margin-bottom:2.2rem}
.acoes{display:flex;flex-wrap:wrap;gap:.8rem}
a{display:inline-block;font-size:.92rem;text-decoration:none;padding:.75em 1.3em;border-radius:3px;transition:opacity .2s}
a:hover{opacity:.82}
a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.pri{background:var(--accent);color:var(--paper);font-weight:500}
.sec{border:1px solid var(--line);color:var(--ink)}
footer{position:fixed;bottom:1.6rem;left:0;right:0;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--ink-soft);letter-spacing:.1em}
</style>
</head>
<body>
<main class="wrap">
<div class="mark" aria-hidden="true"><span></span><span></span><span></span></div>
<span class="cod">Erro 404</span>
<h1>Esta página não existe.</h1>
<p>O endereço pode ter mudado, ou o link que te trouxe até aqui está incorreto. O site continua no ar — é só voltar.</p>
<div class="acoes">
<a class="pri" href="/">Ir para a página inicial</a>
<a class="sec" href="/psicologos/">Sites para psicólogos</a>
</div>
</main>
<footer>MARTIN BASE — NOVO HAMBURGO / RS</footer>
</body>
</html>
